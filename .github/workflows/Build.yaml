name: Build

on:
    push:
        branches:
            - master

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      build-cmd: --linux deb rpm AppImage
                      artifact-name: linux
                      artifact-path: |
                          dist/*.deb
                          dist/*.rpm
                          dist/*.AppImage
                    - os: windows-latest
                      build-cmd: --win
                      artifact-name: windows
                      artifact-path: dist/*.exe
                    - os: macos-latest
                      build-cmd: --mac
                      artifact-name: mac
                      artifact-path: dist/*.dmg

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout repo
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 26

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Install rpm tooling (Linux only)
              if: matrix.os == 'ubuntu-latest'
              run: sudo apt-get update && sudo apt-get install -y rpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build and package
              run: pnpm exec electron-builder ${{ matrix.build-cmd }}
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: astra-${{ matrix.artifact-name }}
                  path: ${{ matrix.artifact-path }}
                  if-no-files-found: error